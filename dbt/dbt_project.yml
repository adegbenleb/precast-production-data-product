name: precast
version: "1.0.0"
profile: precast

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]

models:
  precast:
    # Write model and column descriptions into Unity Catalog as table and column comments.
    +persist_docs:
      relation: true
      columns: true
    staging:
      +schema: silver
      +materialized: view
    gold:
      +schema: gold
      +materialized: table

seeds:
  precast:
    +schema: ref
